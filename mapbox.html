<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Map</title>
    <link
      href="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.css"
      rel="stylesheet"
    />
    <style>
      /* Ensure the map takes up the full screen */
      #map {
        height: 100vh;
      }

      /* Style for the back button in the top right corner */
      #backButton {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 8px 16px;
        background-color: #000;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
        z-index: 10; /* Ensures it stays on top of the map */
      }
    </style>
  </head>
  <body>
    <!-- Mapbox section where the map is displayed -->
    <section id="mapboxSection" style="height: 100vh;">
      <div id="map"></div>

      <!-- Back Button -->
      <button id="backButton">Back to Homepage</button>
    </section>

    <script src="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.js"></script>
    <script>
      // Initialize the Mapbox map with the provided access token
      mapboxgl.accessToken =
        "pk.eyJ1IjoiYWJlaHdlMiIsImEiOiJjbHgzejIwbWcweWF0MmtxMXhzZ3JpdHRxIn0.QWRObYX_632YsxXJGMkv-w";

      const map = new mapboxgl.Map({
        container: 'map', // Map container ID
        style: 'mapbox://styles/mapbox/streets-v11', // Style URL
        center: [0, 0], // Initial map center coordinates [longitude, latitude]
        zoom: 2, // Initial zoom level
      });

      // Back button functionality to return to the homepage
      document.getElementById('backButton').addEventListener('click', function() {
        window.location.href = 'https://prggkel19.netlify.app';  // Redirects to the homepage
      });
    </script>
  </body>
</html>
