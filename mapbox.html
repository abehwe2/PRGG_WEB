<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta Interaktif</title>

    <!-- Mapbox CSS -->
    <link href="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.css" rel="stylesheet" />

    <style>
        /* Fullscreen map styling */
        #map {
            height: 100vh;
            width: 100%;
        }

        /* Back button styling */
        #backButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            z-index: 10; /* Keep above the map */
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <button id="backButton" onclick="goBack()">Kembali ke Beranda</button>

    <!-- Mapbox Map Container -->
    <div id="map"></div>

    <!-- Mapbox JavaScript -->
    <script src="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.js"></script>

    <!-- Mapbox Inline JavaScript -->
    <script>
        // Back Button Functionality
        function goBack() {
            window.location.href = "index.html"; // Redirect to the homepage
        }

        // Mapbox Token and Initialization
        mapboxgl.accessToken = "pk.eyJ1IjoiYWJlaHdlMiIsImEiOiJjbHgzejIwbWcweWF0MmtxMXhzZ3JpdHRxIn0.QWRObYX_632YsxXJGMkv-w";

      const map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/mapbox/streets-v11", // Default Mapbox Streets style
    center: [106.832, -6.983],
    zoom: 6,
});


        // Add Navigation Controls
        map.addControl(new mapboxgl.NavigationControl());
    </script>
</body>
</html>
