<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta Interaktif</title>

    <!-- Mapbox CSS -->
    <link href="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.css" rel="stylesheet" />

    <style>
        /* Fullscreen map styling */
        #map {
            height: 100vh;
            width: 100%;
        }

        /* Back button styling */
        #backButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            z-index: 10; /* Keep above the map */
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <button id="backButton" onclick="goBack()">Kembali ke Beranda</button>

    <!-- Mapbox Map Container -->
    <div id="map"></div>

    <!-- Mapbox JavaScript -->
    <script src="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.js"></script>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
