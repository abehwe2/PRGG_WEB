<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Map</title>
    <link
      href="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Mapbox section where the map is displayed -->
    <section id="mapboxSection" style="height: 100vh;">
      <div id="map" style="height: 100%;"></div>

      <!-- Back Button -->
      <button id="backButton" style="position: absolute; top: 20px; left: 20px; padding: 10px 20px; background-color: #000; color: white; border: none; border-radius: 5px;">
        Back to Homepage
      </button>
    </section>

    <script src="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.js"></script>
    <script>
      // Initialize the Mapbox map (make sure you've added your Mapbox token)
      mapboxgl.accessToken = 'YOUR_MAPBOX_ACCESS_TOKEN';
      const map = new mapboxgl.Map({
        container: 'map', // Map container ID
        style: 'mapbox://styles/mapbox/streets-v11', // Style URL
        center: [0, 0], // Initial map center coordinates [longitude, latitude]
        zoom: 2, // Initial zoom level
      });

      // Back button functionality to return to the homepage
      document.getElementById('backButton').addEventListener('click', function() {
        window.location.href = '/';  // Redirects to the homepage (change path if needed)
      });
    </script>
  </body>
</html>
