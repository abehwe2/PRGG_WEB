<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualisasi Pergerakan Pasukan Mataram Islam ke Batavia</title>

    <!-- Link to EB Garamond font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">

    <!-- Mapbox CSS -->
    <link href="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.css" rel="stylesheet" />

    <style>
        /* Ensure the map takes up the full screen */
        #map {
            height: 100vh;
        }

        /* Style for the back button in the top right corner */
        #backButton {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            z-index: 10;
        }

        /* Intro container styling */
        #introContainer {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
        }

        #story {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            max-width: 300px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- Intro Section with Start Button -->
    <div id="introContainer">
        <h1>Storymap Pergerakan Pasukan Mataram Islam ke Batavia</h1>
        <p>Selamat datang di petualangan kita! Klik tombol di bawah ini untuk memulai eksplorasi.</p>
        <button id="startButton">Mulai Eksplorasi</button>
    </div>

    <!-- Mapbox map container -->
    <div id="map"></div>

    <!-- Story content box -->
    <div id="story"></div>

    <!-- Back button -->
    <button id="backButton">Back to Homepage</button>

    <!-- Mapbox JavaScript -->
    <script src="https://unpkg.com/mapbox-gl@2.11.0/dist/mapbox-gl.js"></script>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
