<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Visualisasi Pergerakan Pasukan Mataram Islam ke Batavia Tahun 1628 dan
      1629
    </title>

    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <style>
      /* Basic styles for the map and container */
      #map {
        width: 100%;
        height: 500px;
      }
      #introContainer {
        position: absolute;
        z-index: 1;
        background: rgba(255, 255, 255, 0.8);
        padding: 20px;
      }
      #story {
        position: absolute;
        z-index: 1;
        bottom: 10px;
        left: 10px;
        background: rgba(255, 255, 255, 0.8);
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <!-- Container for header and button -->
    <div class="container" id="introContainer">
      <h1>
        Visualisasi Pergerakan Pasukan Mataram Islam ke Batavia Tahun 1628 dan
        1629
      </h1>
      <p>
        Selamat datang di petualangan kita! Klik tombol di bawah ini untuk
        memulai eksplorasi.
      </p>
      <button id="startButton">Mulai Eksplorasi</button>
    </div>

    <!-- Mapbox map container -->
    <div id="map"></div>

    <!-- Story content box -->
    <div id="story"></div>
    <!-- Initially empty -->

    <!-- Link to the external JS file -->
    <script src="script.js"></script>
  </body>
</html>
